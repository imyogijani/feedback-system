    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login - Feedback System</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: 'Arial', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .login-container {
                background: white;
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
                width: 100%;
                max-width: 400px;
            }
            .login-header {
                text-align: center;
                margin-bottom: 30px;
            }
            .login-header h1 {
                color: #333;
                font-size: 28px;
                margin-bottom: 10px;
            }
            .form-group {
                margin-bottom: 20px;
            }
            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #333;
                font-weight: 500;
            }
            .form-group input {
                width: 100%;
                padding: 12px 15px;
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                font-size: 16px;
                transition: border-color 0.3s ease;
            }
            .form-group input:focus {
                outline: none;
                border-color: #667eea;
            }
            .btn-login {
                width: 100%;
                padding: 12px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: transform 0.2s ease;
            }
            .btn-login:hover {
                transform: translateY(-2px);
            }
            .error-message {
                background: #fee;
                color: #c33;
                padding: 10px;
                border-radius: 10px;
                margin-bottom: 20px;
                border: 1px solid #fcc;
            }
            .back-link {
                text-align: center;
                margin-top: 20px;
            }
            .back-link a {
                color: #667eea;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="login-header">
                <h1>🔐 Admin Login</h1>
                <p>Access your admin dashboard</p>
            </div>
            
                        
            <form method="POST">
                <input type="hidden" name="admin_login" value="1">
                <div class="form-group">
                    <label for="admin_username">Username:</label>
                    <input type="text" id="admin_username" name="admin_username" required 
                           value=""
                           placeholder="Enter username">
                </div>
                
                <div class="form-group">
                    <label for="admin_password">Password:</label>
                    <input type="password" id="admin_password" name="admin_password" required 
                           placeholder="Enter password">
                </div>
                
                <button type="submit" class="btn-login">
                    Login to Admin Panel
                </button>
            </form>
            
            <div style="margin-top: 20px; padding: 10px; background: #f0f8ff; border-radius: 10px; font-size: 14px;">
                <strong>Default Admin:</strong><br>
                Username: <code>admin</code><br>
                Password: <code>admin@123</code>
            </div>
            
            <div class="back-link">
                <a href="/feedback/">← Back to Home</a>
            </div>
        </div>
    </body>
    </html>
